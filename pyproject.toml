[project]
name = "bimanual-tabletop-vla"
version = "0.1.0"
description = "Hackathon-scoped dual SO-101 MuJoCo task planning and OpenVINO pipeline"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mujoco>=3.3,<4",
  "numpy>=2.0,<3",
  "pillow>=11,<13",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
intel = ["openvino>=2025.2", "nncf>=2.18"]
train = ["lerobot[dataset]==0.6.0"]
reasoning = ["transformers>=5.3,<6"]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[project.scripts]
tabletop-build-scene = "tabletop_vla.sim.build_scene:main"
tabletop-smoke = "tabletop_vla.sim.smoke:main"
tabletop-render = "tabletop_vla.sim.render:main"
tabletop-web = "tabletop_vla.server:main"
tabletop-plan = "tabletop_vla.planning.task_planner:main"
tabletop-eval = "tabletop_vla.evaluate:main"
tabletop-drawer-eval = "tabletop_vla.sim.drawer:main"
tabletop-record = "tabletop_vla.record:main"
tabletop-train-act = "tabletop_vla.train_act:main"
tabletop-eval-act = "tabletop_vla.evaluate_act:main"
tabletop-openvino-bench = "tabletop_vla.openvino.benchmark:main"
tabletop-export-act = "tabletop_vla.openvino.export_act:main"
tabletop-vlm-probe = "tabletop_vla.perception.vlm:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabletop_vla"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
